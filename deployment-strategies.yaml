# ──────────────────────────────────────────────────────────────
# CANARY DEPLOYMENT
# 10 % of traffic goes to canary (1 canary pod vs 9 stable pods)
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-canary
  namespace: aceest
  labels:
    app: aceest-fitness
    track: canary
spec:
  replicas: 1                      # 1 of 10 total pods = 10 % traffic
  selector:
    matchLabels:
      app: aceest-fitness
      track: canary
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: canary
    spec:
      containers:
        - name: aceest-fitness
          image: <anishjha12>/aceest-fitness:2.0.0
          ports:
            - containerPort: 5000

---
# The main Service selects both stable AND canary pods
# because it only matches `app: aceest-fitness`
# (track label is absent from the selector)
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-canary-svc
  namespace: aceest
spec:
  selector:
    app: aceest-fitness            # matches stable + canary pods
  ports:
    - port: 80
      targetPort: 5000
  type: LoadBalancer

---
# ──────────────────────────────────────────────────────────────
# SHADOW DEPLOYMENT
# Mirror 100 % of live traffic to shadow; responses not served
# Uses Nginx mirror or Istio mirror (shown with annotation)
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-shadow
  namespace: aceest
  annotations:
    deployment.kubernetes.io/strategy: "shadow"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      track: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: shadow
    spec:
      containers:
        - name: aceest-fitness
          image: <anishjha12>/aceest-fitness:2.0.0
          ports:
            - containerPort: 5000

---
# ──────────────────────────────────────────────────────────────
# A/B TESTING DEPLOYMENT
# Route traffic based on HTTP header (requires Ingress / Istio)
# Header:  X-User-Group: beta  --> v2
# Default                      --> v1
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-v2
  namespace: aceest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      version: v2
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: v2
    spec:
      containers:
        - name: aceest-fitness
          image: <anishjha12>/aceest-fitness:2.0.0
          ports:
            - containerPort: 5000

---
# Nginx Ingress with header-based routing for A/B
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-ingress
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-User-Group"
    nginx.ingress.kubernetes.io/canary-by-header-value: "beta"
spec:
  rules:
    - host: aceest.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-fitness-v2-svc
                port:
                  number: 80

---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-v2-svc
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
    version: v2
  ports:
    - port: 80
      targetPort: 5000

---
# ──────────────────────────────────────────────────────────────
# ROLLING UPDATE (explicit strategy manifest)
# maxSurge=1 / maxUnavailable=0 ensures zero downtime
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-rolling
  namespace: aceest
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-fitness-rolling
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: aceest-fitness-rolling
    spec:
      containers:
        - name: aceest-fitness
          image: <anishjha12>/aceest-fitness:2.0.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
