# ──────────────────────────────────────────────────────────────
# ACEest Fitness – Kubernetes Namespace
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: aceest
  labels:
    app: aceest-fitness

---
# ──────────────────────────────────────────────────────────────
# Base Deployment (used by Rolling Update strategy)
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness
  namespace: aceest
  labels:
    app: aceest-fitness
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # Zero-downtime rolling update
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: "1.0.0"
    spec:
      containers:
        - name: aceest-fitness
          image: <anishjha12>/aceest-fitness:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

---
# ──────────────────────────────────────────────────────────────
# Service
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-service
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer
